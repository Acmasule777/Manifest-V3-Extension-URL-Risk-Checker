<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; background: #fdecea; padding: 40px; text-align: center; }
    .box { max-width: 480px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #c0392b; }
    .url { word-break: break-all; font-size: 13px; color: #555; background: #f5f5f5; padding: 8px; border-radius: 4px; margin: 12px 0; }
    .score { font-weight: bold; margin: 12px 0; }
    ul { text-align: left; font-size: 13px; }
    button { padding: 10px 16px; margin: 6px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .back { background: #4CAF50; color: white; }
    .proceed { background: #eee; color: #333; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">⚠ Warning: Risky Site</h1>
    <div class="url" id="url"></div>
    <div class="score" id="score"></div>
    <ul id="findings"></ul>
    <button class="back" id="back">Go Back to Safety</button>
    <button class="proceed" id="proceed">Proceed Anyway (Not Recommended)</button>
  </div>
  <script src="warning.js"></script>
</body>
</html>
